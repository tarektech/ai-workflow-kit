name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh tests/smoke.sh skills/setup-ai-workflow/scripts/install.sh
      - name: Smoke tests
        run: bash tests/smoke.sh
